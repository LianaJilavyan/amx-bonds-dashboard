# .github/workflows/inspect.yml
# Manual-only helper: fetches the raw AMX snapshot and prints the first part
# of it into the run log, so the real field names can be read without running
# anything on a local machine. Run it from Actions → inspect → Run workflow.
name: inspect

on:
  workflow_dispatch:
    inputs:
      chars:
        description: "How many characters of the response to print"
        default: "6000"
        required: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show AMX response
        run: |
          curl -s "https://amx.am/api/getMarketData/corporate_bonds" \
            -H "accept: */*" \
            -H "referer: https://amx.am/en/market_data/corporate_bonds" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36" \
            -o response.txt
          echo "=== First ${{ inputs.chars }} characters of the response ==="
          head -c ${{ inputs.chars }} response.txt
          echo ""
          echo "=== Any lines mentioning NMC / Mortgage (for issuer-name check) ==="
          grep -io '.\{0,120\}\(nmc\|mortgage\).\{0,120\}' response.txt | head -20 || echo "(none found in raw text)"
