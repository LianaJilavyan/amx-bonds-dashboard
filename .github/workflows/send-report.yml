# .github/workflows/send-report.yml
name: send-report

# Manual only. Actions -> send-report -> Run workflow -> type date + email -> Run.
# Only people with WRITE access to the repo can trigger this, and RESEND_API_KEY is a
# masked secret that is never exposed to pull requests from forks — so on a public repo
# the "send" button is still effectively limited to your team.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date: "latest", or YYYY-MM-DD, or "DD Mon YYYY" (e.g. 05 Aug 2026)'
        default: "latest"
        required: true
      email:
        description: "Recipient email address"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (brings the committed /data with it)
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build and send the report
        env:
          DATE: ${{ inputs.date }}
          EMAIL: ${{ inputs.email }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
        run: node scripts/report.mjs
