# .github/workflows/send-report.yml
name: send-report

# Manual only. Actions -> send-report -> Run workflow -> type a date -> Run.
# Builds the report and COMMITS it to data/reports/. No email, no secrets.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date: "latest", or YYYY-MM-DD, or "DD Mon YYYY" (e.g. 05 Aug 2026)'
        default: "latest"
        required: true

permissions:
  contents: write   # needed so the job can commit the report file back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (brings the committed /data with it)
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build the report file
        env:
          DATE: ${{ inputs.date }}
        run: node scripts/report.mjs

      - name: Commit the report back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/
          if git diff --staged --quiet; then
            echo "No change in the report — nothing to commit."
          else
            git commit -m "report: as of ${{ inputs.date }}"
            git push
          fi
